name: Petyra validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: petyra-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:web
      - run: pnpm --filter @petyra/mobile exec expo install --check
      - run: pnpm --filter @petyra/mobile exec expo export --platform ios --platform android --output-dir dist
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
